# SATRIA — production-ish compose overlay (TLS edge, loopback only)
# Usage:
#   ./deploy/gen-self-signed-cert.sh deploy/certs
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# UI+API via HTTPS: https://127.0.0.1:8443

services:
  api:
    env_file:
      - deploy/env/docker-panitia.generated.env
    environment:
      SADT_API_HOST: "0.0.0.0"
    ports: !reset []

  ui:
    ports: !reset []

  edge:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - ui
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/satria.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

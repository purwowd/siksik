[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-detector"
version = "0.2.0"
description = "Lightweight sexual content detector (NudeNet + SmolVLM via llama.cpp)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sd-detector" }]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
    "nudenet>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
sd-detector = "sd_detector.cli:main"
sd-detector-api = "sd_detector.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sd_detector = ["py.typed"]
